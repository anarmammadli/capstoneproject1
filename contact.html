    <main>
        <h2>Get in Touch</h2>

        <form action="mailto:amammadli17928@ada.edu.az" method="post" enctype="text/plain" class="contact-form">
            <label for="name">Name:</label>
            <input type="text" id="name" name="Name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="Email" required>

            <label for="phone">Phone (optional):</label>
            <input type="tel" id="phone" name="Phone" placeholder="Type phone number if needed">

            <label for="reason">Reason:</label>
            <select id="reason" name="Reason">
                <option value="Question">Question</option>
                <option value="Collab">Collaboration</option>
                <option value="Other">Other</option>
            </select>

            <label for="message">Message:</label>
            <textarea id="message" name="Message" rows="6" placeholder="Write your message..."></textarea>

            <button type="submit">Send Email</button>
            <button type="reset">Reset Form</button>
        </form>
    </main>
